name: CI

on:
  push:
    branches: [dev, supabasev2, main]
  pull_request:
    branches: [dev, supabasev2, main]

jobs:
  analyze-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Dependencias
        run: flutter pub get

      - name: Análisis estático
        run: flutter analyze

      - name: Pruebas
        run: flutter test

      - name: Build web (modo demo)
        run: flutter build web --release

      - name: Smoke test Supabase (si hay secretos)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_KEY" ]; then
            flutter test test/integration/supabase_smoke_test.dart \
              --dart-define=SUPABASE_URL="$SUPABASE_URL" \
              --dart-define=SUPABASE_KEY="$SUPABASE_KEY"
          else
            echo "Sin secretos configurados: se omite el smoke test."
          fi
