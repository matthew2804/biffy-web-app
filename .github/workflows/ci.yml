name: CI

on:
  push:
    branches: [dev, supabasev2, main, 'hu*']
  pull_request:
    branches: [dev, supabasev2, main]
  # Permite correrlo a mano desde la pestaña Actions (p. ej. antes de la demo).
  workflow_dispatch:

jobs:
  analyze-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Versión fija: la misma con la que se desarrolla (pubspec exige Dart
      # ^3.12.2). Con `channel: stable` sin versión, un Flutter más nuevo
      # (3.50) marca `package:flutter/material.dart` como obsoleto y
      # `flutter analyze` falla aunque el código no haya cambiado.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.8
          cache: true

      - name: Dependencias
        run: flutter pub get

      - name: Análisis estático
        run: flutter analyze

      - name: Pruebas
        run: flutter test

      - name: Build web (modo demo)
        run: flutter build web --release

      - name: Guardar build web
        uses: actions/upload-artifact@v4
        with:
          name: biffy-web
          path: build/web
          retention-days: 7

  integration-supabase:
    # Pruebas contra el proyecto real con las cuentas demo (credenciales de
    # pruebas en los secrets del repo). Sin secretos el job pasa y lo avisa.
    runs-on: ubuntu-latest
    needs: analyze-test-build
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.8
          cache: true

      - name: Dependencias
        run: flutter pub get

      - name: Integración contra Supabase (si hay secretos)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "::warning::Sin SUPABASE_URL/SUPABASE_KEY: se omiten las pruebas reales."
            exit 0
          fi
          # Smoke, perfiles y RLS (HU-1), y reglas del servidor + avisos en
          # vivo + cupones (HU-4). Una a la vez: comparten las cuentas demo.
          for t in supabase_smoke_test hu1_supabase_test hu4_servidor_test; do
            flutter test "test/integration/$t.dart" --concurrency=1 \
              --dart-define=SUPABASE_URL="$SUPABASE_URL" \
              --dart-define=SUPABASE_KEY="$SUPABASE_KEY"
          done

  build-android:
    # APK de release. Sin `android/key.properties` (no se versiona) se firma
    # con la llave de depuración: sirve para instalar y probar, no para la tienda.
    runs-on: ubuntu-latest
    needs: analyze-test-build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.8
          cache: true

      - name: Dependencias
        run: flutter pub get

      - name: Build APK (modo demo)
        run: flutter build apk --release

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: biffy-android
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7

  sql-tests:
    # Migraciones + pruebas de RLS/RPC en un Postgres con PostGIS (sin Supabase).
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - name: Migraciones y pruebas SQL
        env:
          DB_URL: postgres://postgres:postgres@localhost:5432/postgres
        run: tool/test_supabase_sql.sh
